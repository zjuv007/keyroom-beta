name: 🐞 Bug report
description: Something broke or didn't work as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you click, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Key Room version
      description: Help → About Key Room
      placeholder: "0.29.1"
  - type: dropdown
    id: windows
    attributes:
      label: Windows version
      options: ["Windows 11", "Windows 10", "Other"]
  - type: dropdown
    id: build
    attributes:
      label: Which download?
      options: ["Installer (Setup)", "Portable"]
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Drag an image here.
