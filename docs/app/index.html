<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Key Room">
<meta name="theme-color" content="#FFD45C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Key Room</title>
<!-- Key Room © 2026 Zach Juveli. All rights reserved. Beta build — do not redistribute. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#FFFFFF; --surface:#F5F5F7; --surface2:#E8E8ED; --label:#1C1C1E; --label2:#6C6C70;
  --sep:rgba(60,60,67,.16); --root:#FF9500; --alt:#1AA3BF; --ok:#34C759; --new:#E6A800;
  --dot:#D8D8DE; --dotText:#1C1C1E; --neck:#F3EEE5; --fret:#D9D0C2; --string:#B8AE9F; --inlay:#8A7D6A; --halo:#FFFFFF;
  --glass:rgba(250,250,252,.82); --onAccent:#1C1C1E;--onRoot:#fff; --swap:#FFD60A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --label:#F2F2F7; --label2:#8E8E93;
    --sep:rgba(84,84,88,.55); --root:#FF9F0A; --alt:#64D2FF; --ok:#30D158; --new:#FFD60A;
    --dot:#3A3A3C; --dotText:#F2F2F7; --neck:#17140F; --fret:#332D26; --string:#4A4339; --inlay:#7A6F60; --halo:#000000;
    --glass:rgba(30,30,32,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --surface2:#2C2C2E; --label:#F2F2F7; --label2:#8E8E93;
  --sep:rgba(84,84,88,.55); --root:#FF9F0A; --alt:#64D2FF; --ok:#30D158; --new:#FFD60A;
  --dot:#3A3A3C; --dotText:#F2F2F7; --neck:#17140F; --fret:#332D26; --string:#4A4339; --inlay:#7A6F60; --halo:#000000;
  --glass:rgba(30,30,32,.8);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}

/* ---- Header ---- */
.top{display:flex;align-items:flex-end;justify-content:space-between;margin:8px 2px 18px}
.top h1{font-size:34px;line-height:1.05;font-weight:700;letter-spacing:-.02em;margin:0}
.top .key{font-size:15px;color:var(--label2);margin-top:4px}
.hdr-r{display:flex;align-items:center;gap:10px}
.themebtn{height:34px;padding:0 14px;border-radius:999px;background:var(--surface2);color:var(--label);font-size:14px;font-weight:600}
.keybadge{width:52px;height:52px;border-radius:16px;background:var(--root);color:var(--onRoot);
  display:grid;place-items:center;font-size:26px;font-weight:700;letter-spacing:-.02em}

/* ---- Level 1: phase map ---- */
.map{background:var(--surface);border-radius:20px;padding:14px 12px 12px}
.phase{display:flex;flex-direction:column;gap:6px;min-width:0}
.cells{display:flex;gap:4px}
.legend{display:flex;gap:14px;margin-top:10px;font-size:12px;color:var(--label2);padding-left:2px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;vertical-align:0}

/* ---- Next action ---- */
.next{margin-top:12px;display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:20px;padding:14px 14px 14px 16px;
  box-shadow:inset 4px 0 0 var(--root)}
.next .t{flex:1;min-width:0}
.next .t small{display:block;font-size:12px;color:var(--label2);margin-bottom:2px}
.next .t span{font-size:16px;font-weight:600;line-height:1.3}
.btn{background:var(--root);color:var(--onRoot);font-weight:600;font-size:15px;padding:10px 16px;border-radius:999px;white-space:nowrap}
.btn.ghost{background:var(--surface2);color:var(--label)}
.btn.ok{background:var(--ok);color:var(--onAccent)}
.btn:disabled{opacity:.4;cursor:default}

/* ---- Level 2: week ---- */
.week{margin-top:28px;padding:0 2px}
.week h2{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.015em;margin:4px 0 6px}
.week .feel{font-size:15px;line-height:1.45;color:var(--label2);margin:0;max-width:52ch}
.notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.note{min-width:44px;padding:7px 6px 6px;border-radius:12px;background:var(--surface);text-align:center}
.note b{display:block;font-size:17px;font-weight:600}
.note small{display:block;font-size:11px;color:var(--label2);margin-top:1px}
.note.root{background:var(--root);color:var(--onRoot)}
.note.root small{color:var(--onAccent);opacity:.7}
.note{position:relative}.note.new{box-shadow:inset 0 0 0 2px var(--new)}
.note.new::after{content:'';position:absolute;top:-6px;right:-6px;width:15px;height:15px;background:var(--new);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.note.new small{color:var(--new);font-weight:600}

/* ---- Level 3: modules on a spine ---- */
.mods{margin-top:22px;position:relative}
.mod{position:relative;padding-left:44px;margin-bottom:14px}
.mod::before{content:"";position:absolute;left:15px;top:34px;bottom:-14px;width:2px;background:var(--sep)}
.mod:last-child::before{display:none}
.num{position:absolute;left:0;top:14px;width:32px;height:32px;border-radius:50%;background:var(--surface2);
  display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--label2)}
.mod.complete .num{background:var(--ok);color:var(--onAccent)}
.mod.active .num{background:var(--root);color:var(--onRoot)}
.card{background:var(--surface);border-radius:20px;padding:16px}
.card h3{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.card .do{font-size:14px;color:var(--label2);margin:3px 0 14px;line-height:1.4}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{height:34px;min-width:44px;padding:0 12px;border-radius:999px;background:var(--surface2);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;gap:5px}
.pchip.sel{background:var(--label);color:var(--surface)}
.pchip.learned:not(.sel){color:var(--ok)}
.pchip.locked{opacity:.4;cursor:default}
.pchip svg{width:11px;height:11px}

.board{margin:14px -4px 6px;overflow-x:auto}
.board svg{display:block;width:100%;min-width:300px;height:auto}
.wrap.wide{max-width:none;padding-left:clamp(16px,2.5vw,40px);padding-right:clamp(16px,2.5vw,40px)}
.lvl .board:not(.neck) svg{max-width:820px;margin:0 auto}
.xch{min-width:64px;padding:8px 12px;border-radius:12px;background:var(--surface2);border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:1px}
.xch b{font-size:16px;font-weight:700}.xch small{font-size:11px;color:var(--label2)}
.xch.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 22%,var(--surface2))}
.xcap{font-size:14px;color:var(--label2);margin:8px 2px}.xcap b{color:var(--label);font-size:16px}.xcap span{font-weight:600;color:var(--label)}
.linkbtn{color:var(--alt);font-weight:600;margin-left:6px}
.hit{cursor:pointer}rect.hit:hover{fill-opacity:.06}.hit:focus-visible{outline:none;stroke:var(--alt);stroke-width:2}
.board.neck svg{min-width:1050px}
.board.neck{scrollbar-width:thin}
.dot circle{transition:r .12s}
.dot.hit circle{stroke:var(--label);stroke-width:2.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.seg{display:inline-flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--label2)}
.seg button.on{background:var(--surface);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.spacer{flex:1}
.key-l{display:flex;gap:12px;font-size:12px;color:var(--label2);margin-top:8px}
.key-l i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* progressions */
.prog{border-top:1px solid var(--sep);padding:12px 0}
.prog:first-of-type{border-top:0;padding-top:0}
.prog .head{display:flex;align-items:center;gap:10px}
.prog .head .nm{flex:1;min-width:0}
.prog .nm b{display:block;font-size:15px;font-weight:600}
.prog .nm small{font-size:13px;color:var(--label2)}
.play{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.play svg{width:16px;height:16px;fill:var(--label)}
.play.on{background:var(--root)}
.play.on svg{fill:var(--onAccent)}
.pv{margin-top:10px}
.uchords{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}.uch{flex:none}
.uch{display:inline-flex;flex-direction:column;align-items:center;gap:3px;padding:10px 12px 8px;border-radius:12px;background:var(--surface2);border:2px solid transparent}
.uch span{display:flex;align-items:baseline;gap:5px}.uch em{font-style:normal;font-size:11px;color:var(--label2)}.uch .mchord{display:block}
.uch b{font-size:18px;font-weight:700}.uch small{font-size:12px;color:var(--label2);font-weight:600}
.uch.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,var(--surface2))}
.form{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:3px;margin-top:10px;max-width:720px}
.fc{height:30px;border-radius:7px;background:color-mix(in srgb,var(--cc) 26%,var(--surface2));display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--label);padding:0;transition:background .1s}
.fc.gap{margin-right:6px}
.fc.on{background:var(--cc);color:#fff;transform:scale(1.06)}
.land{margin-top:14px;border-top:1px solid var(--sep);padding-top:12px}.lhd{font-size:13px;font-weight:700;color:var(--label2)}
.swapnote{margin-top:8px;font-size:13px;color:var(--label)}.swapnote span{display:inline-block;background:var(--swap);color:#1C1C1E;font-weight:800;border-radius:7px;padding:2px 8px;margin-right:6px}
.fcap{font-size:12px;color:var(--label2);margin:5px 2px 0}
.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}
.ch{height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:15px;font-weight:600;transition:background .1s}
.ch.on{background:var(--root);color:var(--onRoot)}
.tempo{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--label2);margin-top:4px}
.tempo input{flex:1;accent-color:var(--root)}
.tempo b{color:var(--label);font-weight:600;min-width:58px;text-align:right}

/* today */
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--sep)}
.check:first-of-type{border-top:0;padding-top:0}
.box{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--sep);display:grid;place-items:center;margin-top:1px}
.check.on .box{background:var(--ok);border-color:var(--ok)}
.box svg{width:13px;height:13px;stroke:var(--onAccent);fill:none;stroke-width:3;opacity:0}
.check.on .box svg{opacity:1}
.check .tx{font-size:15px;line-height:1.4}
.check.on .tx{color:var(--label2);text-decoration:line-through;text-decoration-color:var(--sep)}
.check .tx small{display:block;font-size:13px;color:var(--label2)}
.timer{font-variant-numeric:tabular-nums}
.finish{margin-top:14px;display:flex;gap:8px;align-items:center}
.finish .btn{flex:1;padding:13px}
.views{display:flex;width:100%;margin-top:14px}
.views button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 4px}
.views button span{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--sep);font-size:11px}
.views button.on span{background:var(--root);color:var(--onRoot)}
.views button:disabled{opacity:.35;cursor:default}
.hint{font-size:13px;color:var(--label2);margin:8px 2px 0;line-height:1.4}
.shapeline{display:flex;gap:10px;align-items:center;margin-top:4px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.shapeline b{display:block;font-size:15px;font-weight:600}
.shapeline small{display:block;font-size:12px;color:var(--label2);margin-top:1px}
.tabs{display:flex;width:100%;margin:-4px 0 16px}
.tabs button{flex:1;padding:9px 6px;font-size:14px}
.sbar{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:8px 10px;border-radius:18px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--sep),0 4px 18px rgba(0,0,0,.08)}
.navw{position:relative;display:flex;gap:2px;flex:none}
.navh{font-size:12px;font-weight:700;color:var(--label2);padding:4px 8px}
.sinst{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}.sinst::-webkit-scrollbar{display:none}
.sinst button{flex:none;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--label2);background:var(--surface2)}.sinst button.on{background:var(--root);color:var(--onRoot)}
.stempo{display:flex;align-items:center;gap:4px;flex:none}.stempo b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}.stempo small{font-size:11px;color:var(--label2);margin-right:2px}
.stempo button{width:30px;height:30px;border-radius:50%;background:var(--surface2);font-size:17px;font-weight:700}
.svol{display:flex;align-items:center;gap:4px;flex:none}.svol input{width:84px;accent-color:var(--root)}
.bout-wrap{display:flex;gap:16px;align-items:center;min-height:96px;margin:4px 2px 6px}#bdiag .mchord{display:block}
.bname{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.bname.dim{font-size:20px;color:var(--label2)}
.balts{font-size:14px;color:var(--label2);margin-top:2px}
.bnm{height:38px;border-radius:999px;border:1px solid var(--sep);background:var(--surface2);color:var(--label);padding:0 14px;font:inherit;font-size:15px;min-width:0;width:200px}
.bhit{cursor:pointer}
.repo{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.rcard{background:var(--surface2);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.rload{display:flex;flex-direction:column;align-items:center;gap:2px}.rload b{font-size:16px}.rload small{font-size:12px;color:var(--label2);font-variant-numeric:tabular-nums}
.ract{display:flex;gap:8px}.rplay,.rdel{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--label2);font-size:13px}
.radd{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--label);font-size:18px;font-weight:700}
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 10px}.pchipc{display:flex;flex-direction:column;align-items:center;background:var(--surface2);border-radius:12px;padding:6px 8px 4px;border:2px solid transparent}
.pchipc.on{border-color:var(--root)}.pload,.pload2{display:flex;flex-direction:column;align-items:center;padding:2px 6px}.pload b,.pload2 b{font-size:16px}.pload small,.pload2 small{font-size:11px;color:var(--label2);min-height:13px}
.pmv{display:flex;gap:2px}.pmv button{width:24px;height:22px;border-radius:6px;color:var(--label2);font-size:13px}.pmv button:hover{background:var(--surface)}
.pan{border-top:1px solid var(--sep);padding-top:10px;margin-top:4px}.pkey{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}.pkey span{font-size:13px;color:var(--label2)}.pkey b{font-size:22px}.pkey small{font-size:13px;color:var(--label2)}
.plab{font-size:12px;font-weight:700;color:var(--label2);margin:12px 2px 6px}
.schs{display:flex;flex-wrap:wrap;gap:8px}.sch{display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;border-radius:12px;background:var(--surface2);text-align:left;border:2px solid transparent}
.sch:first-child{border-color:var(--root)}.sch b{font-size:15px}.sch small{font-size:12px;color:var(--label2)}.sch.nolink{cursor:default;opacity:.85}
.trynext{background:var(--surface2);border-radius:14px;padding:10px 12px 2px;margin-bottom:6px}.trynext>span{font-size:13px;font-weight:700}
.jobs{display:grid;gap:4px}.job{display:flex;gap:10px;align-items:flex-start}.jl{width:84px;flex:none;font-size:13px;font-weight:800;padding-top:8px}.jl small{display:block;font-size:11px;font-weight:600;color:var(--label2)}
.jl.home{color:#30B0C7}.jl.lift{color:#AF52DE}.jl.tens{color:#FF2D55}.jl.color{color:#E6A800}
.psug.home{border-color:#30B0C7}.psug.lift{border-color:#AF52DE}.psug.tens{border-color:#FF2D55}.psug.color{border-color:#E6A800}
.psug.nx1{border-style:solid;border-width:2px;background:var(--surface)}.psug.used{opacity:.5}
.psug{display:flex;flex-direction:column;align-items:center;padding:6px 12px;border-radius:12px;border:1.5px dashed var(--sep);background:transparent}.psug b{font-size:14px}.psug small{font-size:11px;color:var(--label2)}
.rplay svg{width:13px;height:13px;fill:var(--label)}
.lvl{background:var(--surface);border-radius:20px;padding:14px;margin-bottom:12px}
.lh{display:flex;align-items:center;flex-wrap:wrap;row-gap:8px;gap:8px;font-size:17px;font-weight:700;margin-bottom:10px}
.ln{width:24px;height:24px;border-radius:50%;background:var(--root);color:var(--onRoot);display:grid;place-items:center;font-size:13px}
.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.kchip{height:38px;border-radius:11px;background:var(--surface2);font-weight:600;font-size:15px}
.kchip.on{background:var(--label);color:var(--surface)}
.lvl .note{background:var(--surface2)}.lvl .note.root{background:var(--root)}
.neck{margin:8px -14px 4px;padding:0 6px}.neck svg{min-width:1050px}.shapeline .mchord{flex:none}
.cy{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;background:var(--surface2);font-weight:700;font-size:14px}
.cy i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.cy.on{box-shadow:inset 0 0 0 2px var(--c)}
.arr{color:var(--label2);font-size:15px}
.btn.sm{padding:6px 12px;font-size:13px}
.th{font-weight:700;font-size:15px;margin-bottom:6px}
.tr{display:flex;justify-content:space-between;font-size:14px;padding:4px 0;border-top:1px solid var(--sep)}
.tr span{color:var(--label2)}
.empty{text-align:center;color:var(--label2);font-size:14px;padding:18px 24px;border:1.5px dashed var(--sep);border-radius:20px}
.smap{margin-top:14px;border-top:1px solid var(--sep);padding-top:10px}
.smh{font-size:13px;color:var(--label2);margin:0 0 4px 2px}
.tr b{text-align:right;max-width:72%}
.foot{margin-top:28px;text-align:center;font-size:12px;color:var(--label2)}
.foot button{color:var(--label2);text-decoration:underline;font-size:12px}
/* ============ POLISH PASS ============ */
:root{--hl:color-mix(in srgb,var(--root) 13%,transparent);--hl2:color-mix(in srgb,var(--root) 22%,transparent);--ring:0 0 0 3px color-mix(in srgb,var(--root) 45%,transparent);--card-b:1px solid color-mix(in srgb,var(--label) 7%,transparent)}
button{transition:background-color .15s,color .15s,box-shadow .15s,border-color .15s,transform .1s,opacity .15s}
button:not(:disabled):active{transform:scale(.97)}
button:focus-visible,input:focus-visible,.hit:focus-visible{outline:none;box-shadow:var(--ring)}
/* cards */
.lvl,.card,.map,.next{border:var(--card-b);border-radius:22px}
.lvl{padding:18px}.card{padding:18px}
.lh{font-size:19px;margin-bottom:12px}.ln{width:28px;height:28px;font-size:14px}
.card h3{font-size:20px}
/* segmented controls */
.seg{padding:4px}.seg button{height:34px;padding:0 14px;font-size:14px}
.seg button:not(.on):not(:disabled):hover{background:var(--hl);color:var(--label)}
.seg button.on{box-shadow:0 1px 4px rgba(0,0,0,.14)}
.tabs{margin:0 0 14px}.tabs button{height:42px;font-size:15px}
/* pills, chips, cards */
.pchip,.kchip{height:40px;font-size:15px;padding:0 16px}
.pchip:not(.sel):hover,.kchip:not(.on):hover,.cy:not(.on):hover{background:var(--hl);color:var(--label)}.uch:hover,.xch:hover,.rcard:hover,.pchipc:hover,.sch:hover{border-color:color-mix(in srgb,var(--root) 55%,transparent)}
.rcard{border:2px solid transparent}
.psug:hover{background:var(--hl);border-style:solid}
.fc:hover{filter:brightness(1.08)}
.check:hover .box{border-color:var(--root)}
/* buttons */
.btn{height:44px;padding:0 20px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:not(:disabled):hover{filter:brightness(1.06);box-shadow:0 2px 10px color-mix(in srgb,var(--root) 35%,transparent)}
.btn.ghost:not(:disabled):hover{background:var(--hl);box-shadow:none;filter:none}
.btn.sm{height:34px;padding:0 14px;font-size:14px}
.play{width:46px;height:46px}.play:hover{background:var(--hl2)}.play svg{width:18px;height:18px}
.linkbtn:hover{text-decoration:underline}
.themebtn{height:40px;padding:0 16px}.themebtn:hover{background:var(--hl)}
/* floating bar: bigger, calmer */
.sbar{top:10px;gap:12px;padding:8px 10px;border-radius:22px;border:var(--card-b)}
.navw{gap:4px;padding-right:12px;margin-right:2px;border-right:1px solid var(--sep)}
.sinst{gap:6px}.sinst button{height:38px;padding:0 15px;font-size:14px}
.sinst button:not(.on):hover{background:var(--hl);color:var(--label)}
.stempo{gap:6px;padding:0 4px;border-left:1px solid var(--sep);padding-left:12px}.stempo button{width:36px;height:36px;font-size:19px}.stempo button:hover{background:var(--hl2)}
.stempo b{font-size:17px;min-width:34px}
.svol{border-left:1px solid var(--sep);padding-left:12px}.svol input{width:110px;height:28px}
/* neck tap targets */
rect.hit:hover,rect.lhit:hover,rect.bhit:hover{fill:var(--root);fill-opacity:.09}
.bnm{height:44px}.bnm:focus{border-color:var(--root);outline:none;box-shadow:var(--ring)}
.tabs .ts{display:none}.themebtn{white-space:nowrap}
@media (max-width:640px){
  .tabs .tl{display:none}.tabs .ts{display:inline}
  .sbar{gap:8px;padding:8px}.navw{padding-right:0;border-right:0}
  .stempo{margin-left:auto;padding-left:8px}.stempo button{width:34px;height:34px}.stempo small{display:none}
  .svol{padding-left:6px;gap:0}.svol svg{display:none}.svol input{width:58px}.sbar{flex-wrap:wrap}.navw,.stempo,.svol{flex:none}
  .sinst{order:3;flex:1 1 100%}.sinst button{height:34px;padding:0 13px}
  .lvl,.card{padding:14px}.top h1{font-size:30px}}

function positions(sc,rk=4){

  const minor=sc.iv.includes(3)&&!sc.iv.includes(4);
  const base=sc.base||(sc.iv.length===5?sc.iv:(minor?[0,3,5,7,10]:[0,2,4,7,9]));

    for(let i=0;i<12;i++){ps.push(R0+base[idx]+12*oct);idx++;if(idx===n){idx=0;oct++}}
    let notes=ps.map((p,i)=>{const s=Math.floor(i/2);return{s,f:p-STR[s],m:p}});
    if(Math.min(...notes.map(x=>x.f))<0)notes.forEach(x=>{x.f+=12;x.m+=12});
    if(Math.min(...notes.map(x=>x.f))>=12)notes.forEach(x=>{x.f-=12;x.m-=12});
    if(extra.length){
      const lo=Math.min(...notes.map(x=>x.f)),hi=Math.max(...notes.map(x=>x.f)),add=[];

    notes=notes.filter(x=>sc.iv.includes(x.iv));
    out.push(notes);
  }
  return out.sort((x,y)=>Math.min(...x.map(n=>n.f))-Math.min(...y.map(n=>n.f)));
}

const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

function dayMins(k){const L=LOG[k]||{};return (L.s||0)/60+(L.m||0)+(L.et||0)*.25+(L.r||0)*.5+(L.c||0)}

function streak(){const d=new Date();if(!activeDay(dkey(d)))d.setDate(d.getDate()-1);let n=0;while(activeDay(dkey(d))&&n<999){n++;d.setDate(d.getDate()-1)}return n}

function detectPitch(b,sr){const n=b.length;let rms=0;for(let i=0;i<n;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/n);if(rms<.01)return -1;

function centerFix(root){(root||document).querySelectorAll('svg text').forEach(t=>{const c=t.previousElementSibling;if(!c||c.tagName!=='circle')return;const fs=parseFloat(t.getAttribute('font-size'));if(!fs)return;

function rmData(){const wk=[];let tot=0,done=0;for(let w=1;w<=11;w++){if(!WEEKS[w])continue;let n=0;try{n=wkPositions(w).length}catch(e){n=5}const l=[...Array(n).keys()].filter(i=>learned(w,i)).length;wk.push({w,n,l,m:!!S.done[w]});tot+=n;done+=l}
  const pct=tot?Math.round(done/tot*100):0,cur=S.current||1;let next=null;for(const x of wk){if(x.w<cur)continue;const i=[...Array(x.n).keys()].find(i=>!learned(x.w,i));if(i!=null){next={w:x.w,i};break}}
  const shp=new Set(Object.keys(SHP.done||{}).filter(k=>SHP.done[k]).map(k=>k.replace(/\d+$/,''))),mem=Math.min(shp.size,20);
  let mins=0;for(let i=0;i<7;i++)mins+=dayMins(addDays(-i));
  return{wk,tot,done,pct,cur,next,mem,mins:Math.round(mins)}}
function roadmapHTML(){const D=rmData();let h=`<div class="rmap" data-rm role="button" tabindex="0" aria-label="Roadmap ${D.pct}% — open Mastery"><div class="rmh"><small>Roadmap</small><b>${D.pct}%</b><span>${D.done} of ${D.tot} boxes · Week ${D.cur} of 11</span><em>Mastery ›</em></div><div class="rmbar">`;
  PHASES.forEach(P=>{h+=`<div class="rmph" style="flex:${P.weeks.length}"><div class="rmsegs">${P.weeks.map(w=>{const x=D.wk.find(y=>y.w===w)||{n:1,l:0},f=Math.round(x.l/x.n*100),cls=x.l===x.n?'done':w===D.cur?'cur':'';return `<i class="rmseg ${cls}" title="Week ${w}: ${x.l}/${x.n} boxes"><u style="width:${f}%"></u>${w===D.cur?'<b class="rmyou">▲</b>':''}</i>`}).join('')}</div><small>${P.n}</small></div>`});
  return h+`</div></div>`}
function rmLineHTML(){const D=rmData();return `<div class="rmline" data-rm title="Roadmap ${D.pct}% · ${D.done} of ${D.tot} boxes"><i style="width:${Math.max(D.pct,1)}%"></i></div>`}
function ringSVG(v,col,lab,val,sub){const r=34,c=2*Math.PI*r,f=Math.max(0,Math.min(1,v));return `<div class="mring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="9"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)" class="mrfill"${f<=0?' opacity="0"':''}/><text x="42" y="47" text-anchor="middle" font-size="17" font-weight="800" fill="var(--label)">${Math.round(f*100)}%</text></svg><b>${lab}</b><span>${val}</span><small>${sub}</small></div>`}
function openMastery(){const D=rmData();closeMastery();const m=document.createElement('div');m.id='mastery';m.className='mastery';
  const nx=D.next?`Week ${D.next.w} · ${wkScName(WEEKS[D.next.w].s)} · Box ${D.next.i+1}`:'Everything learned. Keep reviewing.';
  m.innerHTML=`<div class="mcard" role="dialog" aria-label="Mastery"><div class="mhd"><div><small>Mastery</small><h3>${D.pct}% of the roadmap</h3></div><button class="mclose" aria-label="Close"><svg class="gi" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg></button></div>
    <div class="mrings">${ringSVG(D.done/D.tot,'var(--lime)','Learn',`${D.done} / ${D.tot} boxes`,'Boxes marked learned')}${ringSVG(D.mem/20,'var(--chc)','Memorize',`${D.mem} / 20 shapes`,'Chord shapes memorized in Recall')}${ringSVG(D.mins/60,'var(--root)','Play',`${D.mins} / 60 min`,'Practice in the last 7 days')}</div>
    <div class="mphase">${PHASES.map(P=>{const ws=D.wk.filter(x=>P.weeks.includes(x.w)),l=ws.reduce((a,x)=>a+x.l,0),n=ws.reduce((a,x)=>a+x.n,0);return `<div><span>${P.n}</span><i><u style="width:${n?l/n*100:0}%"></u></i><b>${l}/${n} boxes</b></div>`}).join('')}</div>
    <div class="mprac">${chartHTML()}${(()=>{const d=dayItems(),nD=d.filter(Boolean).length,stk=streak(),due=srsDue().length;return heroStats([['Today',nD+'/3',nD===3],['Streak',stk+(stk===1?' day':' days'),stk>0],['Review',due+' due',null]])})()}</div>
    <div class="mnext"><div><small>Next step</small><b>${nx}</b></div>${D.next?'<button class="btn" id="mGo">Go<svg class="gi" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5"/></svg></button>':''}</div></div>`;
  document.body.appendChild(m);requestAnimationFrame(()=>m.classList.add('on'));
  m.onclick=e=>{if(e.target===m||e.target.closest('.mclose'))closeMastery()};m.querySelectorAll('[data-rng]').forEach(b=>b.onclick=e=>{e.stopPropagation();UI.rng=+b.dataset.rng;openMastery()});
  const g=document.getElementById('mGo');if(g)g.onclick=()=>{closeMastery();UI.tab='weekly';UI.hv='learn';UI.week=D.next.w;UI.pos=D.next.i;render();window.scrollTo({top:0,behavior:'smooth'})}}
function closeMastery(){const m=document.getElementById('mastery');if(m)m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMastery();if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('[data-rm]')){e.preventDefault();openMastery()}});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-rm]'))openMastery()});


/* ---------- Chord zoom: hover any small chord chart to see it large, same proportions ---------- */
(function(){const SEL='svg.cvert,svg.mchord,svg.pmini,svg.bvert,[data-zfr]';let cur=null;
  const hide=()=>{const z=document.getElementById('chzoom');if(z)z.remove();cur=null};
  const can=()=>matchMedia('(hover:hover) and (pointer:fine)').matches;
  document.addEventListener('mouseover',e=>{if(!can()||!e.target.closest||Date.now()-(window._scrT||0)<250)return;
    let t=e.target.closest(SEL);if(t&&(t.closest('#chzoom,#boxmag,.tile')||t.closest('.board')))t=null;if(t&&t.tagName.toLowerCase()==='svg'){const host=t.closest('[data-zfr]');if(host)t=host}
    if(t===cur)return;hide();if(!t)return;
    let body='',name='',piano=false;
    if(t.dataset&&t.dataset.zfr){const fr=JSON.parse(t.dataset.zfr),rt=t.dataset.zrt===''?null:+t.dataset.zrt;body=chordVert(fr,rt,rt);name=t.dataset.zname||'';piano=PIANO()}
    else{const r=t.getBoundingClientRect();if(r.width>=(t.classList.contains('pmini')?420:220))return;const c=t.cloneNode(true);c.removeAttribute('width');c.removeAttribute('height');piano=t.classList.contains('pmini');body=c.outerHTML;
      const host=t.closest('.cldb,.clcard,.uch,.shapeline,.fadebox,.rcard,.sch,.xch,.bout-wrap');const card=t.closest('.clcard'),b=(card&&card.querySelector('.clch b'))||(host&&host.querySelector('b'));name=b?b.textContent:'';const sm=t.closest('.cldb')&&t.closest('.cldb').querySelector('small');if(sm)name+=(name?' · ':'')+sm.textContent}
    cur=t;const z=document.createElement('div');z.id='chzoom';z.className='chzoom'+(piano?' wide':'');z.setAttribute('aria-hidden','true');z.innerHTML=(name?`<div class="czh">${name}</div>`:'')+body;document.body.appendChild(z);
    const r=t.getBoundingClientRect(),w=z.offsetWidth,h=z.offsetHeight;let x=r.left+r.width/2-w/2,y=r.bottom+10;if(y+h>innerHeight-10)y=r.top-h-10;x=Math.max(10,Math.min(innerWidth-w-10,x));z.style.left=x+'px';z.style.top=Math.max(10,y)+'px'});
  document.addEventListener('mouseout',e=>{if(cur&&e.target.closest&&e.target.closest(SEL)===cur&&!(e.relatedTarget&&cur.contains(e.relatedTarget)))hide()});
  document.addEventListener('scroll',hide,true);document.addEventListener('mousedown',hide)})();
function bStats(){const g=id=>document.getElementById(id);if(!g('stN'))return;g('stN').textContent=UI.b.fr.filter(f=>f!=null).length;g('stS').textContent=(BUILD_LIST||[]).length;g('stP').textContent=(UI.p||[]).length}
{const _b=drawBuild,_r=drawRepo,_p=drawProg;drawBuild=function(){_b.apply(this,arguments);bStats()};drawRepo=function(){_r.apply(this,arguments);bStats()};drawProg=function(){_p.apply(this,arguments);bStats()}}
render();

<script>
/* Phone: floating header. The page itself scrolls on phones, so watch window scroll. */
(function(){var mq=matchMedia('(max-width:820px)');var spacer=0;
  function upd(){var t=document.querySelector('.frame .top');if(!t)return;
    if(!mq.matches){if(t.dataset.ph){t.classList.remove('stuck');t.style.marginBottom='';delete t.dataset.ph}return}
    var y=scrollY,on=t.classList.contains('stuck');
    if(!on&&y>32){var h0=t.getBoundingClientRect().height;t.classList.add('stuck');t.dataset.ph=1;var h1=t.getBoundingClientRect().height;t.style.marginBottom=(h0-h1)+'px'}
    else if(on&&y<8&&t.dataset.ph){t.classList.remove('stuck');t.style.marginBottom='';delete t.dataset.ph}}
  addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
  new MutationObserver(function(){var t=document.querySelector('.frame .top');if(t&&!t.dataset.ph&&scrollY>32)upd()}).observe(document.getElementById('app')||document.body,{childList:true});
})();
</script>
